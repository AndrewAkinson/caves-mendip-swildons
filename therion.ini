# Therion reads this file from the directory it is run in, so every
# config built from the project root (CI included) picks it up.
#
# Source Sans 3 for all the text on the maps, in place of TeX's Computer
# Modern. The fonts are in fonts/ under the SIL Open Font License.
# Regular, italic, bold, sans, sans italic -- "bold" is the semibold
# weight, which sits better beside the regular than the full bold.
# Needs LCDF Typetools (otftotfm), which the CI image has.
pdf-fonts fonts/SourceSans3-Regular.otf fonts/SourceSans3-It.otf fonts/SourceSans3-Semibold.otf fonts/SourceSans3-Regular.otf fonts/SourceSans3-It.otf
