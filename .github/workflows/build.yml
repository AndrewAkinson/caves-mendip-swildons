name: Build survey

# Every push to main rebuilds the sheets and publishes them to GitHub
# Pages. Pull requests get the same build, but the results are only
# attached to the run as a downloadable artifact and summarised on the
# PR, not published. Every run, main included, attaches the artifact.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # output/ is git-ignored, so it does not exist in a fresh checkout
      # and Therion will not create it -- it fails at the copy step with
      # "cannot copy: No such file or directory".
      - name: Create output directory
        run: mkdir -p output

      # The survey is tied to the OS grid (cs OSGB:ST in
      # Swildons_Centreline.th), and turning that into lat/long for the
      # KML exports needs Ordnance Survey's OSTN15 grid-shift file.
      # Therion would download it itself on every run; fetch it once,
      # cache it, and point PROJ at it so the build never needs the
      # network.
      - name: Cache the OSTN15 grid
        id: grid
        uses: actions/cache@v4
        with:
          path: proj/
          key: proj-uk_os_OSTN15_NTv2_OSGBtoETRS-v1

      - name: Fetch the OSTN15 grid
        if: steps.grid.outputs.cache-hit != 'true'
        run: |
          mkdir -p proj
          curl -fsSL --retry 3 -o proj/uk_os_OSTN15_NTv2_OSGBtoETRS.tif \
            https://cdn.proj.org/uk_os_OSTN15_NTv2_OSGBtoETRS.tif

      # The container carries Therion, a TeX distribution, METAPOST,
      # Ghostscript and python3 -- everything the build needs. It is
      # pinned to a version rather than :latest so a survey rebuilt in a
      # year renders identically; bump it deliberately.
      # --user maps the container's root output back to the runner user
      # so later steps can read and upload it.
      #
      # Three configs, because Therion takes one map per projection per
      # run: thconfig is the whole cave, thconfig-entrance the Entrance
      # Series at 1:200, thconfig-stanton the planning sheet with
      # Stanton's survey. The others get their own logs so therion.log
      # stays the main build's, which web/make_index.py reads.
      - name: Build with Therion
        run: |
          therion() {
            docker run --rm \
              -v "${{ github.workspace }}:/project" \
              -u "$(id -u):$(id -g)" \
              -e PROJ_DATA=/project/proj:/usr/share/proj \
              -e PROJ_NETWORK=OFF \
              ghcr.io/paperclipmonkey/therion:6.4.0 "$@"
          }
          therion thconfig
          therion -l output/therion-entrance.log thconfig-entrance
          therion -l output/therion-stanton.log thconfig-stanton

      - name: Fail if Therion logged an error
        run: |
          status=0
          for log in therion.log output/therion-entrance.log output/therion-stanton.log; do
            if grep -qE "^therion: error" "$log"; then
              echo "::error::Therion reported an error in $log"
              grep -nE "^therion: (error|warning)" "$log"
              status=1
            fi
          done
          # Warnings are worth surfacing but not worth failing on. The
          # drawings currently give a handful of "scrap outline
          # intersects itself" warnings from MetaPost.
          if grep -qiE "warning" therion.log output/therion-entrance.log output/therion-stanton.log; then
            echo "::group::Therion warnings"
            grep -inE "warning" therion.log output/therion-entrance.log output/therion-stanton.log | sort -u
            echo "::endgroup::"
          fi
          exit $status

      - name: Build the index page
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/project" \
            -u "$(id -u):$(id -g)" \
            -e GITHUB_SHA -e GITHUB_REF_NAME -e GITHUB_REPOSITORY \
            --entrypoint python3 \
            ghcr.io/paperclipmonkey/therion:6.4.0 web/make_index.py
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Summarise the build
        run: |
          {
            echo "### Survey built"
            echo
            cat output/stats.md
            echo
            echo "| File | Size |"
            echo "| --- | ---: |"
            for f in output/*.pdf output/*.svg output/*.3d output/*.lox output/*.kml; do
              [ -e "$f" ] || continue
              printf '| `%s` | %s |\n' "$(basename "$f")" "$(du -h "$f" | cut -f1)"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # Every run attaches the built sheets to the run page, so they can
      # be downloaded whether or not Pages is set up. On a PR this is
      # the only place they go.
      - name: Upload build
        id: pr_artifact
        uses: actions/upload-artifact@v4
        with:
          name: survey-${{ github.event.pull_request.number || github.ref_name }}-${{ github.sha }}
          path: output/
          retention-days: 14

      # ---- pull requests: summarise on the PR, don't publish ---------

      - name: Comment on the PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const art = '${{ steps.pr_artifact.outputs.artifact-url }}';
            // web/make_index.py already worked these out; reuse them.
            let stats = '';
            try { stats = fs.readFileSync('output/stats.md', 'utf8'); } catch (e) {}

            const files = fs.readdirSync('output')
              .filter(f => /\.(pdf|svg|3d|lox|kml)$/.test(f))
              .sort()
              .map(f => `\`${f}\``).join(' · ');

            const body = [
              '### 🗺️ Survey rebuilt from this PR',
              '',
              stats,
              `**[⬇︎ Download the built sheets](${art})** — unzip and open \`index.html\`.`,
              '',
              `<sub>${files}</sub>`,
              '',
              `<sub>[Full build log](${run}) · commit \`${context.sha.slice(0,7)}\`</sub>`,
            ].join('\n');

            // Update our own previous comment rather than adding a new one
            // on every push to the branch.
            const marker = '### 🗺️ Survey rebuilt from this PR';
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const mine = comments.find(c =>
              c.user.type === 'Bot' && c.body.startsWith(marker));
            if (mine) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: mine.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      # ---- main: publish to Pages ------------------------------------
      - name: Setup Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
